services:
  # Target Server (Alice): hosts services, customizable per lab
  alice:
    build:
      context: ./targets/lab01
      dockerfile: Dockerfile
    container_name: labinf_alice
    privileged: true
    networks:
      secnet:
        ipv4_address: 10.0.2.10
    restart: unless-stopped

  # Client (Bob): legitimate client interacting with Alice
  bob:
    image: kalilinux/kali-rolling:latest
    container_name: labinf_bob
    privileged: true
    networks:
      secnet:
        ipv4_address: 10.0.2.20
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends iproute2 net-tools iputils-ping curl s-nail netcat-traditional python3 && sleep infinity"
    restart: unless-stopped

  # Attacker (Chuck): Kali Linux with security suite (Ettercap, Nmap, Wireshark, etc.)
  chuck:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: labinf_chuck
    privileged: true
    networks:
      secnet:
        ipv4_address: 10.0.2.30
    command: sleep infinity
    restart: unless-stopped

networks:
  secnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.0.2.0/24
          gateway: 10.0.2.1
